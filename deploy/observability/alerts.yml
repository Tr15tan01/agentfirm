# Alerts map to the SLOs in docs/ops/load-test-2026-11-17.md and the runbook (docs/ops/runbook.md).
groups:
  - name: agentfirm
    rules:
      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: page }
        annotations: { summary: "API is not answering metrics scrapes", runbook: "runbook.md#api-down" }
      - alert: WorkerDown
        expr: up{job="worker"} == 0 or (time() - agentfirm_worker_heartbeat_timestamp_seconds) > 120
        for: 2m
        labels: { severity: page }
        annotations: { summary: "Worker stopped (no heartbeat for 2 min); tasks won't run", runbook: "runbook.md#worker-down" }
      - alert: High5xxRate
        expr: sum(rate(agentfirm_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(agentfirm_http_requests_total[5m])), 0.001) > 0.02
        for: 5m
        labels: { severity: page }
        annotations: { summary: "More than 2% of API requests fail with 5xx", runbook: "runbook.md#errors" }
      - alert: SlowReads
        expr: histogram_quantile(0.95, sum by (le) (rate(agentfirm_http_request_duration_seconds_bucket{method="GET",route!~".*/stream"}[10m]))) > 0.3
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "Read p95 above the 300 ms SLO for 15 min", runbook: "runbook.md#latency" }
      - alert: QueueBacklog
        expr: agentfirm_queue_oldest_seconds > 300
        for: 5m
        labels: { severity: page }
        annotations: { summary: "A task has waited over 5 min to start", runbook: "runbook.md#queue" }
      - alert: ModelCallsFailing
        expr: sum(rate(agentfirm_model_calls_total{outcome!="ok"}[10m])) > 0 and sum(rate(agentfirm_model_calls_total{outcome="ok"}[10m])) == 0
        for: 10m
        labels: { severity: page }
        annotations: { summary: "No successful model calls in 10 min", runbook: "runbook.md#providers" }
      - alert: WorkerCrashes
        expr: increase(agentfirm_worker_runs_total{outcome="crashed"}[15m]) > 3
        labels: { severity: ticket }
        annotations: { summary: "Worker turns crashing (leases will retry)", runbook: "runbook.md#worker-down" }
      - alert: PaddleWebhookErrors
        expr: increase(agentfirm_billing_webhooks_total{result=~"error|bad_signature"}[1h]) > 0
        labels: { severity: ticket }
        annotations: { summary: "Paddle webhooks rejected or not applied; see Platform → Billing events", runbook: "runbook.md#billing" }
      - alert: DiskFilling
        expr: (node_filesystem_avail_bytes{mountpoint="/host",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/host",fstype!="tmpfs"}) < 0.15
        for: 10m
        labels: { severity: page }
        annotations: { summary: "Less than 15% disk left", runbook: "runbook.md#disk" }
      - alert: PostgresConnectionsHigh
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 10m
        labels: { severity: ticket }
        annotations: { summary: "Postgres connections above 80% of max_connections", runbook: "runbook.md#database" }
