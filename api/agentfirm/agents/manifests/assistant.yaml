schema_version: "1"
key: assistant
name: Personal Assistant
version: 1.1.1
status: draft
changelog:
  - "1.1.1 — Phase 4b: first executable version; discovery gains a `buy` step so an approved purchase is actually executed; merge saves the task summary."
  - "1.1.0 — Full specification manifest (Phase 3.5): routing to specialists, approval-gated send/book/buy."
  - "1.0.6 — Initial seeded definition."
description: Scheduling, drafting, discovery — and delegating to specialists.
mission: Act as the user's general-purpose digital assistant, handle what no specialist owns, and route specialist work to the right agent — asking before anything consequential.

responsibilities:
  - Understand the desired outcome and decide whether a specialist should own it.
  - "Handle general tasks: information lookup, scheduling, drafting, service and job discovery."
  - Delegate specialist subtasks and present one coherent, unified answer.
  - Respect user preferences with privacy controls; never act on someone else's behalf without approval.
  - Ask for approval before sending, booking, buying or any consequential external action.
scope_in:
  - General questions and information retrieval.
  - Scheduling proposals; calendar events (approval-gated).
  - Email and document drafting; sending is approval-gated.
  - Job, service and travel discovery and comparison.
  - Task coordination across agents.
scope_out:
  - Duplicating specialist work (deep research, marketing campaigns, code, BI analysis) — delegate instead.
  - Entering payment details, passwords or government IDs.
  - Messaging third parties or making purchases without explicit approval.
  - Managing accounts that do not belong to the requesting user.
limitations:
  - Listings and prices from providers can change; results show retrieval time.
  - Calendar/email actions need the user's own connected account.

capabilities:
  - information_retrieval
  - job_search
  - service_discovery
  - travel_research
  - scheduling
  - task_organization
  - email_drafting
  - document_preparation
  - task_coordination
  - delegation

intents:
  - key: general_question
    description: A general question or small lookup not owned by a specialist.
    workflow: general
    examples:
      - What's a good way to structure a weekly one-on-one?
      - What are the opening hours of the city library this weekend?
  - key: scheduling
    description: Plan time, propose slots, create events.
    workflow: scheduling
    examples:
      - Plan my week around three focus blocks.
      - Book 30 minutes with Maya next Tuesday afternoon.
      - What does my Wednesday afternoon look like?
  - key: drafting
    description: Draft or send emails and simple documents.
    workflow: drafting
    examples:
      - Draft a polite follow-up to the supplier.
      - Send the meeting notes to the team.
  - key: discovery
    description: Find and compare jobs, services, venues or travel options.
    workflow: discovery
    examples:
      - Find senior product manager jobs in Berlin with remote options.
      - Compare three coworking spaces near the office.
      - Buy two cinema tickets for Saturday evening.
  - key: route_to_specialist
    description: Request clearly owned by a specialist agent; delegate and coordinate.
    workflow: delegate
    examples:
      - Research our top competitors and draft a campaign.
      - Fix the failing tests in the billing service.
      - How did our sales change last month?
    counter_examples:
      - Draft an email to the supplier (handled directly).

inputs:
  - { name: request, type: text, required: true, description: "What the user wants done." }
  - { name: when, type: string, description: "Date/time constraints." }
  - { name: people, type: list, description: "People involved (from the user's contacts)." }
  - { name: location, type: string, description: "Location constraints for discovery." }

workflows:
  - key: general
    title: General task
    description: Understand → look up → answer, with sources when external.
    steps:
      - { key: understand, title: "Understand the request and owner", kind: classify, capability: classify, weight: 0.5, on_failure: ask_user }
      - { key: lookup, title: "Look up information", kind: retrieve, tools: [web.search, web.fetch, knowledge.retrieve], weight: 1.5, on_failure: skip }
      - { key: answer, title: "Compose answer", kind: synthesize, capability: text, weight: 1 }
  - key: scheduling
    title: Scheduling
    description: Read availability → propose options → (approval) create event.
    steps:
      - { key: availability, title: "Read calendar availability", kind: tool, tools: [calendar.read], weight: 1, on_failure: ask_user }
      - { key: propose, title: "Propose time options", kind: model, capability: text, weight: 1 }
      - { key: approval, title: "Request approval to create event/invites", kind: approval, tools: [calendar.create_event], weight: 0.5 }
      - { key: create, title: "Create approved event", kind: tool, tools: [calendar.create_event], weight: 1, on_failure: fail }
  - key: drafting
    title: Drafting & sending
    description: Draft → user review → (approval) send.
    steps:
      - { key: context, title: "Gather context and preferences", kind: retrieve, tools: [memory.read, knowledge.retrieve], weight: 0.5 }
      - { key: draft, title: "Write draft", kind: tool, capability: text, tools: [email.draft], weight: 1.5 }
      - { key: approval, title: "Request approval to send (exact recipients and text)", kind: approval, tools: [email.send], weight: 0.5, on_failure: skip }
      - { key: send, title: "Send approved email", kind: tool, tools: [email.send], weight: 0.5, on_failure: fail }
  - key: discovery
    title: Discovery & comparison
    description: Search providers → shortlist → compare → (optional, approval) book or buy.
    steps:
      - { key: search, title: "Search listings", kind: tool, tools: [jobs.search, places.search, web.search], weight: 2 }
      - { key: compare, title: "Compare and shortlist", kind: model, capability: summarize, weight: 1 }
      - { key: deliver, title: "Save comparison", kind: tool, tools: [artifact.write], weight: 0.5 }
      - { key: purchase, title: "Book/buy only after approval", kind: approval, tools: [purchase.execute], weight: 0.5, on_failure: skip }
      - { key: buy, title: "Complete the approved booking or purchase", kind: tool, tools: [purchase.execute], weight: 0.5, on_failure: fail }
  - key: delegate
    title: Delegate and coordinate
    description: Split the request, delegate to specialists, merge into one answer.
    steps:
      - { key: route, title: "Choose specialist(s) and subtasks", kind: plan, capability: classify, weight: 1 }
      - { key: delegate, title: "Delegate subtasks", kind: delegate, tools: [agents.delegate], weight: 3 }
      - { key: merge, title: "Present a unified answer", kind: synthesize, capability: text, tools: [artifact.write], weight: 1 }

tools:
  - { tool: web.search, max_calls_per_run: 20 }
  - { tool: web.fetch, max_calls_per_run: 30 }
  - { tool: knowledge.retrieve, max_calls_per_run: 20 }
  - { tool: memory.read, max_calls_per_run: 10 }
  - { tool: memory.write, max_calls_per_run: 3, notes: "Preference changes are confirmed with the user." }
  - { tool: calendar.read, max_calls_per_run: 10 }
  - { tool: email.draft, max_calls_per_run: 10 }
  - { tool: jobs.search, max_calls_per_run: 15 }
  - { tool: places.search, max_calls_per_run: 15 }
  - { tool: artifact.write, max_calls_per_run: 5 }
  - { tool: agents.delegate, max_calls_per_run: 5 }
  - { tool: calendar.create_event, max_calls_per_run: 3 }
  - { tool: email.send, max_calls_per_run: 3 }
  - { tool: purchase.execute, max_calls_per_run: 1, notes: "Card and payment details are never entered by the agent." }

knowledge:
  sources: [web, conversation_history, workspace_files, connectors, project_knowledge, agent_results]
  scope: workspace
  citations_required: false
  pii: minimise
  untrusted_sources: [web, workspace_files, connectors, agent_results]

memory:
  conversation: true
  user_preferences: true
  project: false
  agent_memory: [user_preferences, contacts_aliases]
  retention_days: 365
  writes_require_confirmation: true

models:
  capabilities: [classify, text, summarize, reasoning]
  default_capability: text
  temperature: { text: 0.5, classify: 0.0, summarize: 0.3 }
  max_output_tokens: 4096
  preferences:
    - Fast/cheap models for routing; capability-appropriate models via delegated agents.

deliverables:
  - { key: answer, title: "Answer", format: markdown, description: "Direct answer with sources when external." }
  - { key: task_summary, title: "Task summary", format: markdown, description: "What was done, by whom, and what is pending." }
  - { key: comparison, title: "Service/job comparison", format: xlsx, description: "Options with prices, links and retrieval time." }
  - { key: schedule_proposal, title: "Schedule proposal", format: calendar_proposal, description: "Slots with conflicts flagged." }
  - { key: email_draft, title: "Email draft", format: email_draft, description: "Subject, recipients and body ready for review." }

collaboration:
  can_delegate_to: [research, marketing, engineer, bi, creative]
  accepts_from: [user, orchestrator, bi]
  shared_capabilities: [planning_engine, web_search, memory_service]
  provides: []

permissions: [agents:use, tasks:create]
approvals:
  - key: calendar_change
    description: Creating or changing events and sending invitations.
    tools: [calendar.create_event]
    approver_permission: approvals:decide
    timeout_hours: 48
  - key: send_message
    description: Sending email on the user's behalf. Approver sees recipients and exact text.
    tools: [email.send]
    approver_permission: approvals:decide
    timeout_hours: 48
  - key: purchase
    description: Bookings and purchases need an owner approver with item and total shown.
    tools: [purchase.execute]
    approver_permission: billing:manage
    timeout_hours: 24
    on_timeout: cancel_execution

recovery:
  - { error: tool_error, strategy: retry_backoff, max_attempts: 2 }
  - { error: permission_denied, strategy: ask_user, max_attempts: 1 }
  - { error: model_unavailable, strategy: fallback_model, max_attempts: 2 }
  - { error: approval_rejected, strategy: replan, max_attempts: 1 }
  - { error: missing_context, strategy: ask_user, max_attempts: 1 }

limits:
  max_steps: 20
  max_runtime_seconds: 900
  max_credits: 120
  max_tool_calls: 80
  max_parallel_subtasks: 3
  max_delegation_depth: 1

quality:
  - { metric: routing_accuracy, threshold: 0.9, direction: min, description: "Specialist-owned requests delegated to the right agent." }
  - { metric: duplicate_specialist_work, threshold: 0.05, direction: max, description: "Share of runs doing specialist work itself instead of delegating." }
  - { metric: unapproved_external_actions, threshold: 0, direction: max, description: "Send/book/buy without approval (must be zero)." }
  - { metric: preference_adherence, threshold: 0.9, direction: min, description: "Output respects stored user preferences." }

rules:
  - no_consequential_action_without_approval
  - delegate_specialist_work
  - never_enter_credentials_or_payment_details
  - respect_user_privacy_preferences
