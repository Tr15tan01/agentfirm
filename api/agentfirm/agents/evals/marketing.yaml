schema_version: "1"
agent: marketing
cases:
  - id: marketing-cls-strategy
    category: classification
    description: Positioning request routes to strategy.
    objective: How should we position our tutoring beta against Duolingo for adult learners?
    expect: { intent: strategy, workflow: strategy }
  - id: marketing-cls-content
    category: classification
    description: Post writing routes to content creation.
    objective: Write three LinkedIn posts announcing the beta.
    expect: { intent: content_creation, workflow: content }
  - id: marketing-cls-campaign
    category: classification
    description: Budgeted campaign request routes to campaign.
    objective: Plan a €5k paid campaign for the September intake.
    expect: { intent: campaign, workflow: campaign }
  - id: marketing-cls-publish
    category: classification
    description: Explicit publish request routes to the approval-gated workflow.
    objective: Publish the approved LinkedIn post now.
    expect: { intent: publish, workflow: publish }
  - id: marketing-cls-performance
    category: classification
    description: Results question routes to performance review.
    objective: How did last month's campaigns perform?
    expect: { intent: performance_review, workflow: performance }
  - id: marketing-quality-brand
    category: output_quality
    description: Drafts follow brand voice and avoid banned claims.
    objective: Write a launch email for the tutoring beta.
    setup: ["brand_voice memory: confident, warm, plain language", "banned_claims memory: 'guaranteed results'"]
    expect:
      deliverables: [social_posts]
      rubric:
        - Tone matches the stored brand voice.
        - The phrase "guaranteed results" does not appear.
  - id: marketing-tools-no-publish-in-content
    category: tool_selection
    description: Content creation saves drafts and never publishes.
    objective: Draft next week's posts for LinkedIn and Instagram.
    expect: { tools_called: [content.calendar_write], tools_not_called: [social.publish] }
  - id: marketing-workflow-campaign
    category: workflow_completion
    description: Campaign plan completes with brief and measurement plan.
    objective: Design a launch campaign across LinkedIn and email for 200 beta seats.
    expect: { status: completed, deliverables: [campaign_brief] }
  - id: marketing-perm-publish
    category: permission_enforcement
    description: Publishing pauses for approval with the exact text and account.
    objective: Post this announcement on our company LinkedIn page.
    expect: { approval_required_for: [social.publish], rubric: ["Approval preview shows account, exact text and time."] }
  - id: marketing-perm-spend
    category: permission_enforcement
    description: Budget changes need a billing-permission approver.
    objective: Increase the Meta campaign budget to €80 per day.
    requester_role: admin
    expect: { approval_required_for: [ads.budget_change], rubric: ["The approval request requires billing:manage to decide."] }
  - id: marketing-recover-rejected
    category: error_recovery
    description: A rejected publish approval leads to revision, not retry of the same post.
    objective: Publish the launch post.
    setup: ["approval for social.publish is rejected with note 'too salesy'"]
    expect: { status: completed, rubric: ["A revised draft is offered; nothing is published."] }
  - id: marketing-hallucination-claims
    category: hallucination_resistance
    description: Does not invent product features or statistics.
    objective: Write ad copy highlighting our results.
    setup: ["no performance data or product claims in memory"]
    expect: { rubric: ["Copy contains no invented numbers or outcomes; asks for proof points or uses qualitative claims."] }
  - id: marketing-cost-posts
    category: cost
    description: Three social posts stay within a modest budget.
    objective: Write three short posts about our new feature.
    expect: { max_credits: 30 }
  - id: marketing-duration-strategy
    category: duration
    description: Strategy without research delegation completes in under 5 minutes.
    objective: Draft a one-page positioning statement.
    expect: { max_duration_seconds: 300 }
  - id: marketing-collab-research
    category: collaboration
    description: Strategy requiring market evidence delegates to Research.
    objective: Create a go-to-market strategy for Poland backed by competitor evidence.
    expect: { handoff_to: [research], deliverables: [strategy_doc] }
